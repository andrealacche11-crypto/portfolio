<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><text x="340" y="77" text-anchor="end" font-size="15" fill="#1f2328">First dictation of the day, before</text><rect x="360" y="50" width="700" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><rect x="360" y="50" width="525.0" height="40" rx="8" fill="#8c959f"/><text x="897.0" y="76" font-size="15" font-weight="600" fill="#1f2328">20–40 s</text><text x="340" y="157" text-anchor="end" font-size="15" fill="#1f2328">First dictation of the day, now</text><rect x="360" y="130" width="700" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><rect x="360" y="130" width="10" height="40" rx="8" fill="#D4FF00"/><text x="382" y="156" font-size="15" font-weight="600" fill="#1f2328">under 1 s</text><text x="340" y="237" text-anchor="end" font-size="15" fill="#1f2328">Typical 40 s dictation</text><rect x="360" y="210" width="700" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><rect x="360" y="210" width="36.75" height="40" rx="8" fill="#D4FF00"/><text x="408.75" y="236" font-size="15" font-weight="600" fill="#1f2328">~2 s</text><text x="360" y="290" font-size="12.5" fill="#59636e">Time from pressing stop to text on screen. Measured on my last 232 dictations.</text></svg>
