<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker></defs><rect x="30" y="120" width="150" height="66" rx="33" fill="#0d1117" stroke="#3d444d"/><text x="105.0" y="149.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Your shortcut</text><text x="105.0" y="167.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">start and stop</text><rect x="223" y="120" width="150" height="66" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="298.0" y="149.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Floating pill</text><text x="298.0" y="167.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">shows it's recording</text><path d="M180,153.0 L221,153.0" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/><rect x="416" y="120" width="150" height="66" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="491.0" y="149.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Record</text><text x="491.0" y="167.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">on your computer</text><path d="M373,153.0 L414,153.0" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/><rect x="609" y="120" width="150" height="66" rx="10" fill="#D4FF00" stroke="#D4FF00"/><text x="684.0" y="149.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Speech to text</text><text x="684.0" y="167.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#111111">local model</text><path d="M566,153.0 L607,153.0" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/><rect x="802" y="120" width="150" height="66" rx="10" fill="#D4FF00" stroke="#D4FF00"/><text x="877.0" y="149.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Punctuation</text><text x="877.0" y="167.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#111111">small local AI</text><path d="M759,153.0 L800,153.0" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/><rect x="995" y="120" width="150" height="66" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="1070.0" y="149.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Paste</text><text x="1070.0" y="167.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">into any app</text><path d="M952,153.0 L993,153.0" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/><path d="M491.0,186 L491.0,232" fill="none" stroke="#656c76" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/><text x="491.0" y="250" text-anchor="middle" font-size="12" fill="#9198a1">✕ cancels the recording</text><rect x="694" y="14" width="210" height="50" rx="10" fill="#0d1117" stroke="#3d444d"/><text x="799.0" y="35.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Background helper</text><text x="799.0" y="53.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9198a1">keeps the models ready</text><path d="M749,64 L749,118" fill="none" stroke="#656c76" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/><path d="M852,64 L852,118" fill="none" stroke="#656c76" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/><rect x="30" y="247" width="14" height="14" rx="3" fill="#D4FF00"/><text x="52" y="258" font-size="12.5" fill="#9198a1">AI model step</text></svg>
